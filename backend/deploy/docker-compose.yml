version: '3.8'

services:
  # 1. Base de données MongoDB
  mongodb:
    image: mongo:7.0-jammy
    container_name: programactor-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: programactor
    volumes:
      - mongo_data:/data/db
    networks:
      - programactor-net
    ports:
      # Optionnel : mapper sur 127.0.0.1:27017 pour inspection locale uniquement
      - "127.0.0.1:27017:27017"

  # 2. API Backend Node.js
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: programactor-api
    restart: always
    depends_on:
      - mongodb
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/programactor
      JWT_SECRET: ${JWT_SECRET:-changer_ce_secret_jwt_en_production_64_caracteres}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changer_ce_secret_refresh_en_production_64_caracteres}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://www.programactor.pro,https://programactor.pro}
      STUDIO_WHATSAPP_NUMBER: ${STUDIO_WHATSAPP_NUMBER:-237699000000}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@programactor.pro}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Programactor2026!}
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - programactor-net

volumes:
  mongo_data:
    driver: local

networks:
  programactor-net:
    driver: bridge
