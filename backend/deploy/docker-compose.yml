services:
  # API Backend Node.js connectée à MongoDB Atlas
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: programactor-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGODB_URI: ${MONGODB_URI:-mongodb+srv://jesseikoloj39_db_user:FNl0lLrllI6UmmSE@programactor.vqxzekq.mongodb.net/programactor?retryWrites=true&w=majority}
      JWT_SECRET: ${JWT_SECRET:-changer_ce_secret_jwt_en_production_64_caracteres}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changer_ce_secret_refresh_en_production_64_caracteres}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://www.programactor.pro,https://programactor.pro,https://programactor.netlify.app}
      STUDIO_WHATSAPP_NUMBER: ${STUDIO_WHATSAPP_NUMBER:-237699000000}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@programactor.pro}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Programactor2026!}
    ports:
      - "127.0.0.1:5001:5001"
